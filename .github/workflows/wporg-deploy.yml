name: Deploy to WordPress.org (DISABLED)

# Este workflow está DESABILITADO.
# Para habilitar, configure os secrets SVN_USERNAME e SVN_PASSWORD
# no repositório GitHub > Settings > Secrets and variables > Actions
# e mude o 'on' para: push: tags: ['v*']

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (ex: 1.1.3.3)'
        required: true

# Requires secrets: SVN_USERNAME, SVN_PASSWORD
jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest
    if: ${{ false }} # Desabilitado — remova esta linha quando pronto

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: WordPress.org Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ml-gif-pro
